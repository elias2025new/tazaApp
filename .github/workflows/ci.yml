name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Provide dummy env vars for build validation — not real secrets
          TELEGRAM_BOT_TOKEN: "0:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA1"
          TELEGRAM_BOT_USERNAME: "ci_placeholder_bot"
          TELEGRAM_WEBHOOK_SECRET: "ci_placeholder_secret_32_chars_long"
          TELEGRAM_STAFF_CHAT_ID: "12345678"
          SUPABASE_SERVICE_ROLE_KEY: "eyJci_placeholder_service_role_key"
          SUPABASE_JWT_SECRET: "ci_placeholder_jwt_secret_min_32_chars"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJci_placeholder_anon_key"
          NEXT_PUBLIC_APP_URL: "https://placeholder.vercel.app"
          NEXT_PUBLIC_DEV_MOCK_TELEGRAM: "false"
